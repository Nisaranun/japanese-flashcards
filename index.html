      document.getElementById('card-badge').innerText = card.badge;
      document.getElementById('front-text').innerText = card.front;
      document.getElementById('front-hint').innerText = card.hint ? '(' + card.hint + ')' : '';
      document.getElementById('back-text').innerText = card.back;
      document.getElementById('back-subtext').innerText = card.sub;
      document.getElementById('card-counter').innerText = `${currentIndex + 1} / ${currentCards.length}`;
      
      if (isFlipped) {
        document.getElementById('card-inner').classList.remove('rotate-y-180');
        isFlipped = false;
      }
    }

    function flipCard() {
      const inner = document.getElementById('card-inner');
      isFlipped = !isFlipped;
      if (isFlipped) {
        inner.classList.add('rotate-y-180');
      } else {
        inner.classList.remove('rotate-y-180');
      }
    }

    function nextCard() {
      if (currentCards.length === 0) return;
      currentIndex = (currentIndex + 1) % currentCards.length;
      updateCard();
    }

    function prevCard() {
      if (currentCards.length === 0) return;
      currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
      updateCard();
    }

    function shuffleCards() {
      for (let i = currentCards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
      }
      currentIndex = 0;
      updateCard();
    }

    function setCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'cat-btn px-2.5 py-1 rounded-lg border border-[var(--border)] font-medium transition bg-[var(--primary)] text-[var(--primary-foreground)]';
        } else {
          btn.className = 'cat-btn px-2.5 py-1 rounded-lg border border-[var(--border)] font-medium transition hover:bg-[var(--accent)]';
        }
      });

      if (cat === 'all') {
        currentCards = [...allCards];
      } else {
        currentCards = allCards.filter(c => c.cat === cat);
      }
      currentIndex = 0;
      updateCard();
    }

    function speakAnswer(e) {
      if (e) e.stopPropagation();
      const text = currentCards[currentIndex].back;
      if ('speechSynthesis' in window) {
        const cleanText = text.replace(/[\(（].*?[\)）]/g, '').trim();
        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = 'ja-JP';
        window.speechSynthesis.speak(utter);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        flipCard();
      } else if (e.code === 'ArrowRight') {
        nextCard();
      } else if (e.code === 'ArrowLeft') {
        prevCard();
      }
    });

    updateCard();
  </script>
</body>
</html>
